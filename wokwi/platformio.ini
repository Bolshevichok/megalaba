[platformio]
default_envs = temperature-sensor

; ============================================================
; Shared settings
; ============================================================
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; ============================================================
; One device = one function.
; Sensors:
;   temperature-sensor    — DHT22 (temperature only)
;   humidity-sensor       — DHT22 (humidity only)
;   light-sensor          — LDR (photoresistor)
; Actuators:
;   watering-actuator     — Water pump
;   heating-actuator      — Heater
;   ventilation-actuator  — Fan
;   lighting-actuator     — LED
;
; Set -DDEVICE_ID=N to match the device created in backend API.
; ============================================================

[env:temperature-sensor]
build_flags = -DTYPE_TEMPERATURE_SENSOR -DDEVICE_ID=1

[env:humidity-sensor]
build_flags = -DTYPE_HUMIDITY_SENSOR -DDEVICE_ID=2

[env:light-sensor]
build_flags = -DTYPE_LIGHT_SENSOR -DDEVICE_ID=3

[env:watering-actuator]
build_flags = -DTYPE_WATERING_ACTUATOR -DDEVICE_ID=4

[env:heating-actuator]
build_flags = -DTYPE_HEATING_ACTUATOR -DDEVICE_ID=5

[env:ventilation-actuator]
build_flags = -DTYPE_VENTILATION_ACTUATOR -DDEVICE_ID=6

[env:lighting-actuator]
build_flags = -DTYPE_LIGHTING_ACTUATOR -DDEVICE_ID=7
